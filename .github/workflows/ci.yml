name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  check-book:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup just
        uses: extractions/setup-just@v3

      - name: Cache Rust tools
        uses: Swatinem/rust-cache@v2.9.1

      - name: Build book and check links
        run: just build

      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v4
        with:
          path: output/html

  check-rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: snippets/rust

      - name: Check
        working-directory: snippets/rust
        run: cargo check --all-targets

  check-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: snippets/python/requirements.txt

      - name: Check
        working-directory: snippets/python
        run: bash check.sh

  check-js:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, web, react-native]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: snippets/js/${{ matrix.runtime }}
        run: npm install --legacy-peer-deps

      - name: Check
        working-directory: snippets/js/${{ matrix.runtime }}
        run: npm run check

  check-kotlin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Check
        working-directory: snippets/kotlin
        run: ./gradlew build --no-daemon

  check-swift:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check
        working-directory: snippets/swift
        run: swift build

  check-csharp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Check
        working-directory: snippets/csharp
        run: dotnet build

  deploy:
    name: Deploy book
    needs:
      - check-book
      - check-rust
      - check-python
      - check-js
      - check-kotlin
      - check-swift
      - check-csharp
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
